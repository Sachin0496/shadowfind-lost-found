<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShadowFind — Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <main class="login-page">
    <section class="card login-card">

      <div class="login-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <ellipse cx="12" cy="18" rx="7" ry="2.6" fill="rgba(255,255,255,0.30)"/>
          <circle cx="12" cy="9.6" r="5.1" stroke="#ffffff" stroke-width="1.9"/>
        </svg>
      </div>

      <h1 class="login-title">ShadowFind</h1>
      <p class="login-sub">Lost and Found Item Matching Portal</p>

      <div class="alert-info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8v.01M11 12h1v4h1"/>
        </svg>
        <span>You have logged out safely.</span>
      </div>

      <form>
        <label class="field-label" for="email">College Email</label>
        <input class="field" id="email" type="email" value="ananya@college.edu" spellcheck="false" autocomplete="off">

        <label class="field-label" for="password">Password</label>
        <input class="field pw" id="password" type="password" value="123456" autocomplete="off">

        <button class="btn-primary btn-block" type="button">Sign In</button>
      </form>

      <p class="login-alt">Don't have an account? <a href="#">Register here</a></p>

      <div class="demo-box">
        <p class="demo-title">Demo Accounts (password: 123456):</p>
        <p class="demo-emails">ananya@college.edu &middot; rahul@college.edu &middot; priya@college.edu</p>
      </div>

    </section>
  </main>

</body>
</html>
