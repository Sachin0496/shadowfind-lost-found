{% extends "base.html" %}
{% block title %}Log in - ShadowFind{% endblock %}
{% block content %}
<div class="auth">
  <div class="card"><div class="card-body">
    <h1>ShadowFind</h1>
    <p class="sub">Lost and Found Item Matching Portal</p>
    <form method="post">
      <div class="field">
        <label for="email">College Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               placeholder="you@college.edu">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn wide" type="submit">Sign In</button>
    </form>
    <div class="foot">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></div>
    <div class="demo">
      <strong style="color:#444">Demo accounts</strong> (password <code>shadow123</code>):<br>
      <code>ananya@college.edu</code> &middot; <code>rahul@college.edu</code> &middot; <code>priya@college.edu</code>
    </div>
  </div></div>
</div>
{% endblock %}
